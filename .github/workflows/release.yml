name: Release

# Triggers on any tag matching the semver-with-v-prefix convention, e.g. v1.2.3, v1.2.3-rc.1
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

env:
  BIN_NAME: vimouse
  APP_NAME: ViMouse
  MACOS_BUNDLE_ID: com.github.exxml.vimouse
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    env:
      # Declared (empty) so linters recognize `env.ASSET`
      ASSET: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- macOS ----
          - target: x86_64-apple-darwin
            runner: macos-13
            os: macos
          - target: aarch64-apple-darwin
            runner: macos-14
            os: macos

          # ---- Windows ----
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os: windows
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            os: windows

          # ---- Linux ----
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            os: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # winit on Linux needs X11 dev headers to link against at build time.
      # (Cargo.toml enables softbuffer's x11/x11-dlopen features only, no
      # Wayland feature, so no libwayland-dev needed here.)
      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libxtst-dev

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      # ------------------------------------------------------------------
      # OPTIONAL - macOS code-signing & notarization slot in here, after the
      # build and before packaging into the .app bundle below. Skipped for
      # now (unsigned binary - users will see a Gatekeeper warning).
      # When ready:
      #   1. Import Developer ID cert (secrets.MACOS_CERTIFICATE, MACOS_CERTIFICATE_PWD)
      #      into a temporary keychain.
      #   2. `codesign --deep --sign "Developer ID Application: ..." --options runtime "${APP_NAME}.app"`
      #      (sign the .app bundle itself, after it's assembled, not the bare binary)
      #   3. `xcrun notarytool submit "${staging}.zip" --wait`
      #   4. `xcrun stapler staple "${APP_NAME}.app"` then re-zip the stapled bundle.
      # ------------------------------------------------------------------

      - name: Package (.app bundle, zipped, for macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          staging="${BIN_NAME}-${{ matrix.target }}"
          app="${APP_NAME}.app"

          # Standard macOS app bundle layout.
          mkdir -p "${app}/Contents/MacOS"
          mkdir -p "${app}/Contents/Resources"

          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "${app}/Contents/MacOS/${APP_NAME}"
          chmod +x "${app}/Contents/MacOS/${APP_NAME}"

          # No custom .icns - Finder falls back to the generic app icon.
          # To add an icon: cp path/to/icon.icns "${app}/Contents/Resources/AppIcon.icns"
          # and add <key>CFBundleIconFile</key><string>AppIcon</string> to the plist below.

          cat > "${app}/Contents/Info.plist.tmp" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>${APP_NAME}</string>
              <key>CFBundleDisplayName</key>
              <string>${APP_NAME}</string>
              <key>CFBundleIdentifier</key>
              <string>${MACOS_BUNDLE_ID}</string>
              <key>CFBundleVersion</key>
              <string>${GITHUB_REF_NAME#v}</string>
              <key>CFBundleShortVersionString</key>
              <string>${GITHUB_REF_NAME#v}</string>
              <key>CFBundleExecutable</key>
              <string>${APP_NAME}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>LSUIElement</key>
              <true/>
          </dict>
          </plist>
          PLIST
          # Strip the common leading indentation introduced above so the XML
          # declaration is the first byte of the file, as plist parsers require.
          sed 's/^[[:space:]]*//' "${app}/Contents/Info.plist.tmp" > "${app}/Contents/Info.plist"
          rm "${app}/Contents/Info.plist.tmp"

          mkdir -p "$staging"
          mv "${app}" "$staging/"
          cp README.md LICENSE "$staging/" 2>/dev/null || true

          # zip (not tar.gz) preserves the .app bundle in the format macOS
          # users expect to double-click-to-extract via Archive Utility.
          ditto -c -k --sequesterRsrc --keepParent "$staging" "${staging}.zip"
          echo "ASSET=${staging}.zip" >> "$GITHUB_ENV"

      - name: Package (tar.gz for Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          staging="${BIN_NAME}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$staging/"
          cp README.md LICENSE "$staging/" 2>/dev/null || true
          tar -czf "${staging}.tar.gz" "$staging"
          echo "ASSET=${staging}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (zip for Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          staging="${BIN_NAME}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}.exe" "$staging/"
          cp README.md LICENSE "$staging/" 2>/dev/null || true
          7z a "${staging}.zip" "$staging"
          echo "ASSET=${staging}.zip" >> "$GITHUB_ENV"

      - name: Generate checksum
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "macos" ]]; then
            shasum -a 256 "$ASSET" > "${ASSET}.sha256"
          else
            sha256sum "$ASSET" > "${ASSET}.sha256"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Create combined checksums file
        working-directory: dist
        run: cat *.sha256 > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
